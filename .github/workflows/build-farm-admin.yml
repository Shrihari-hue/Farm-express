name: Build Farm Admin

on:
  push:
    branches: [main]
    paths:
      - 'farm-admin/**'
      - '.github/workflows/build-farm-admin.yml'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: farm-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-admin-${{ matrix.os }}
          path: |
            farm-admin/dist-electron/*.dmg
            farm-admin/dist-electron/*.zip
            farm-admin/dist-electron/*.exe
            farm-admin/dist-electron/*.AppImage
          if-no-files-found: warn
